spring.application.name=ecommerce-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_api}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

app.security.secret=${JWT_SECRET:change-this-secret-key-for-local-dev}
app.security.token-expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
